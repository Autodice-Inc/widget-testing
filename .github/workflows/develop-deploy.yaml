name: Deploy to S3 - Widget Testing Dev

on:
  workflow_dispatch:
  push:
    branches:
      - develop
concurrency:
  group: develop

jobs:
  deploy:
    name: Build and publish to S3
    runs-on: ubuntu-latest
    # Also what the AWS role trusts: it only accepts jobs running in this environment.
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WIDGET_LOADER: ${{ vars.VITE_WIDGET_LOADER }}
        run: yarn build

      - name: Upload to S3
        run: |
          # Hashed file names, so they can be cached for good. Old ones are kept:
          # a page opened before this deploy still loads its own.
          aws s3 sync dist/assets/ s3://${{ vars.SITE_S3_BUCKET }}/assets/ \
            --cache-control 'public, max-age=31536000, immutable'
          # index.html and the rest, always revalidated. --delete doesn't reach
          # assets/, which is excluded here.
          aws s3 sync dist/ s3://${{ vars.SITE_S3_BUCKET }}/ \
            --exclude 'assets/*' --delete \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.SITE_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'
