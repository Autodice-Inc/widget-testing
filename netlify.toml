[build]
  command = "yarn build"
  publish = "dist"

# The demo's pages sit at the dealer's own paths, /en and /fr (scripts/mirror-page.mjs).
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# The Spinelli Toyota Lachine look-alike, next to the Nissan Pointe-Claire one.
[[redirects]]
  from = "/toyota"
  to = "/toyota/en/"
  status = 302
  force = true
